name: Arduino Library Manager

# Tells the repo when the Arduino Library Manager index lists the latest tag.
# The indexer lags a git push, so this only opens an issue once the versions match.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compare tag with the Arduino index
        id: index
        run: |
          set -euo pipefail
          result="$(python3 .github/scripts/arduino_index_check.py)"
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          latest="$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest_tag"])')"
          indexed="$(echo "$result" | python3 -c 'import json,sys; v=json.load(sys.stdin)["indexed"]; print(v or "none")')"
          caught="$(echo "$result" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["caught_up"] else "false")')"
          {
            echo "## Arduino Library Manager"
            echo ""
            echo "- Latest git tag: \`$latest\`"
            echo "- Indexed version: \`$indexed\`"
            echo "- Caught up: \`$caught\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when the index catches up
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.index.outputs.result }}
        run: |
          set -euo pipefail
          latest="$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest_tag"])')"
          indexed="$(echo "$RESULT" | python3 -c 'import json,sys; v=json.load(sys.stdin)["indexed"]; print(v or "")')"
          caught="$(echo "$RESULT" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin)["caught_up"] else "no")')"
          if [ "$caught" != "yes" ]; then
            echo "Index is at ${indexed:-nothing}; waiting for $latest."
            exit 0
          fi
          title="Arduino Library Manager indexed Pulsync $latest"
          existing="$(gh issue list --state all --limit 20 --search "in:title \"$title\"" --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "Already reported: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
The Arduino Library Manager index now lists **Pulsync $latest**, matching git tag \`v$latest\`.

- Index: https://downloads.arduino.cc/libraries/library_index.json.gz
- Repo: https://github.com/Pulsync/pulsync-arduino

Install from the Arduino IDE Library Manager once your board package refreshes its index.
EOF
)"
